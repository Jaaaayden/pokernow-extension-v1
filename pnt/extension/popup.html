<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PokerNow Tracker</title>
<style>
  body { margin: 0; width: 320px; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #0b0b0b; background: #f9f9f7; }
  html { scrollbar-width: thin; scrollbar-color: #c3c2b7 transparent; }
  @media (prefers-color-scheme: dark) {
    html { color-scheme: dark; scrollbar-color: #383835 transparent; }
    body { color: #fff; background: #1a1a19; }
    input, select { background: #0d0d0d; color: #fff; border-color: #383835; }
  }
  main { padding: 12px 14px; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; color: #898781; font-size: 12px; margin-top: 8px; }
  input, select { width: 100%; box-sizing: border-box; font: inherit; padding: 5px 7px; border: 1px solid #c3c2b7; border-radius: 6px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 0; background: #2a78d6; color: #fff; cursor: pointer; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .kv span:nth-child(odd) { color: #898781; }
  .ok { color: #0ca30c; } .bad { color: #d03b3b; }
  a { color: #2a78d6; }
  .hint { color: #898781; font-size: 12px; margin: 6px 0 0; }
  .hint:empty { display: none; }
  code { font: 11.5px ui-monospace, Consolas, monospace; user-select: all; word-break: break-all; }
  label.check { display: flex; gap: 6px; align-items: center; color: inherit; }
  label.check input { width: auto; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>PokerNow Tracker</h1>
  <label for="hudmode" title="Side panel: beside the page, on game tabs only. Floating: a box on the game page you can drag and resize; the toolbar icon shows and hides it.">HUD</label>
  <select id="hudmode">
    <option value="panel">Side panel (split screen)</option>
    <option value="float">Floating on the page</option>
  </select>
  <label for="backend" title="Built in: the tracker runs inside the extension, with nothing to install. Companion app: the local server from `pnt setup`, which adds the command line and a log folder kept in sync. Each keeps its own database.">Tracker</label>
  <select id="backend">
    <option value="builtin">Built into the extension</option>
    <option value="companion">Companion app (local server)</option>
  </select>
  <label for="server" id="server-label">Companion server</label>
  <input id="server" placeholder="http://127.0.0.1:52000">
  <p class="hint" id="companion-hint">To have Chrome start it whenever Chrome runs, run once:
    <code id="connect-cmd">pnt connect</code> <span id="native"></span></p>
  <label class="check hidden" id="move-row"><input type="checkbox" id="move" checked> Copy my hands to it</label>
  <p class="hint" id="move-status"></p>
  <label for="poll">Poll every (seconds)</label>
  <input id="poll" type="number" min="2" max="60">
  <label for="livemin" title="A live spot with fewer hands than this is widened to the closest one that has enough.">Min hands for a live spot</label>
  <input id="livemin" type="number" min="1" max="1000">
  <label for="liveknown" title="A live spot is narrowed to boards like this one (highest card, paired or not) only while at least this many shown hands survive it. 0 always narrows.">Min shown hands to narrow by board</label>
  <input id="liveknown" type="number" min="0" max="1000">
  <div class="row"><button id="save">Save</button><span id="health"></span><a id="tracker" target="_blank" rel="noopener" href="#">tracker ↗</a></div>
  <div class="kv" id="status"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
